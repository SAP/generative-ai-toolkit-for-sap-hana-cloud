name: Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v4.9.4
        with:
          python-version: "3.11"

      # Install essential build tools
      - name: Install build dependencies
        run: >-
          python -m pip install --require-hashes
          -r .github/requirements/release-build-py311-linux.txt

      # Optional: Only include if you need dependencies for building
      #- name: Install project dependencies
      #  run: pip install -r requirements.txt

      # New step to clean previous builds
      - name: Clean dist directory
        run: rm -rf dist/ build/ hana_ai.egg-info/

      # Build using setup.py directly
      - name: Build release distribution
        run: python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd344c0ea2d3b63eb6f1cb5a4f  # v1.13.0
